[theme]
base = "dark"
primaryColor = "#4C8DFF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#121B2D"
textColor = "#E6EAF2"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.6rem"
borderColor = "#24314A"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#0F1727"
secondaryBackgroundColor = "#18233A"

[server]
headless = true

[client]
toolbarMode = "minimal"
